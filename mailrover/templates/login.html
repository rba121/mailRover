<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailRover Sign In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f4;
      color: #151719;
    }
    .panel {
      width: min(420px, 100%);
      border: 1px solid #dde1e3;
      border-radius: 8px;
      background: #ffffff;
      padding: 24px;
      box-shadow: 0 14px 36px rgba(21, 23, 25, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: 0;
    }
    .logo {
      width: 176px;
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: 18px;
    }
    p {
      margin: 0 0 18px;
      color: #626970;
      line-height: 1.45;
    }
    label {
      display: grid;
      gap: 7px;
      color: #626970;
      font-size: 0.84rem;
      font-weight: 750;
    }
    input {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      border: 1px solid #cbd1d5;
      padding: 10px 12px;
      font: inherit;
    }
    input:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: #0f766e;
    }
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: #0f766e;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .error {
      min-height: 22px;
      margin-top: 12px;
      color: #b42318;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="/static/images/rover-logo.png" alt="Rover Autonomous Systems">
    <h1>MailRover Sign In</h1>
    <p>Dispatcher and service pages require authorization.</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" autofocus>
      </label>
      <button type="submit">Sign In</button>
      <div class="error">{{ error }}</div>
    </form>
  </main>
</body>
</html>
